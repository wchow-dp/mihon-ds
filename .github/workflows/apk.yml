name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew assemblePreview
      - name: Collect APK
        run: |
          set -e
          ls -R app/build/outputs/apk
          mkdir -p out
          cp app/build/outputs/apk/preview/*universal*.apk out/mihon-ds-frazse-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mihon-ds-apk
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mihon DS (frazse) build ${{ github.run_number }}
          files: out/*.apk
