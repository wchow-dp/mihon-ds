name: Update website

on:
  release:
    types: 
      - published
      - deleted
      - edited

jobs:
  update_website:
    # Upstream only: this pings mihonapp/website to refresh mihon.app, using a token
    # forks do not have. Kept rather than deleted so upstream merges stay conflict-free;
    # the job is skipped here instead of failing on every release.
    if: github.repository == 'mihonapp/mihon'
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Update website
        run: |
          curl --fail-with-body -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.MIHON_BOT_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/mihonapp/website/dispatches \
          -d '{"event_type":"app_release"}'
